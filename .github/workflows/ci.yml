name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Test
        run: cargo test

      - name: Syntax-check install.sh
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          if command -v dash >/dev/null 2>&1; then dash -n install.sh; fi

      - name: Parse install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'install.ps1'), [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
