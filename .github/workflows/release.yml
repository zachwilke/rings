name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl and xz
        run: sudo apt-get update && sudo apt-get install -y musl-tools xz-utils

      - name: Test
        run: cargo test

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/rings dist/rings-x86_64-linux-musl
          xz -k -9 dist/rings-x86_64-linux-musl
          tar -C dist -czf dist/rings-v${VERSION}-x86_64-linux-musl.tar.gz rings-x86_64-linux-musl
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES=".github/release-notes-${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=".github/release-notes-v0.1.0.md"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            dist/rings-x86_64-linux-musl.xz \
            dist/rings-v${VERSION}-x86_64-linux-musl.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES"
