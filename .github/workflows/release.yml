name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test
        run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: rings-x86_64-linux-musl
            pack: xz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: rings-aarch64-linux-musl
            pack: xz
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset: rings-armv7-linux-musleabihf
            pack: xz
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            asset: rings-arm-linux-musleabihf
            pack: xz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: rings-aarch64-apple-darwin
            pack: xz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: rings-x86_64-apple-darwin
            pack: xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rings-x86_64-pc-windows-msvc.exe
            pack: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl (native x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools xz-utils

      - name: Cross toolchain (Linux musl)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: xz on Ubuntu (cross jobs)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (xz)
        if: matrix.pack == 'xz'
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/rings"
          cp "$BIN" "dist/${{ matrix.asset }}"
          xz -k -9 "dist/${{ matrix.asset }}"
          ls -l dist

      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rings.exe" "dist/rings.exe"
          Compress-Archive -Force -Path "dist/rings.exe" -DestinationPath "dist/${{ matrix.asset }}.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          NOTES=".github/release-notes-${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=".github/release-notes-v0.1.0.md"
          fi
          ls -l dist

          # Build jobs run `xz -k` then upload dist/*, so artifacts already
          # contain both the uncompressed musl binary and the .xz. Blind
          # `xz -dk` then dies with "File exists" (run 33358811514).
          set -x
          for stem in rings-x86_64-linux-musl rings-aarch64-linux-musl rings-armv7-linux-musleabihf; do
            if [ -f "dist/$stem" ]; then
              echo "using existing dist/$stem"
            else
              xz -dkf "dist/$stem.xz"
            fi
          done
          # Wrap the three Linux musl binaries in .debs (static — no libc Depends).
          # amd64 <- x86_64-linux-musl, arm64 <- aarch64-linux-musl, armhf <- armv7.
          OUTDIR=dist packaging/debian/build-deb.sh "$VERSION" amd64 dist/rings-x86_64-linux-musl
          OUTDIR=dist packaging/debian/build-deb.sh "$VERSION" arm64 dist/rings-aarch64-linux-musl
          OUTDIR=dist packaging/debian/build-deb.sh "$VERSION" armhf dist/rings-armv7-linux-musleabihf
          ls -l dist/rings_"$VERSION"_*.deb

          DEBS="dist/rings_${VERSION}_amd64.deb dist/rings_${VERSION}_arm64.deb dist/rings_${VERSION}_armhf.deb"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; uploading .deb assets onto the existing tag"
            # Do not re-create the tag. Do not re-upload xz (already on the release).
            # --clobber lets a packaging-only change refresh the debs without a version bump.
            gh release upload "$TAG" $DEBS --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$TAG" \
            dist/rings-x86_64-linux-musl.xz \
            dist/rings-aarch64-linux-musl.xz \
            dist/rings-armv7-linux-musleabihf.xz \
            dist/rings-arm-linux-musleabihf.xz \
            dist/rings-aarch64-apple-darwin.xz \
            dist/rings-x86_64-apple-darwin.xz \
            dist/rings-x86_64-pc-windows-msvc.exe.zip \
            $DEBS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES"

  # Rebuilds Pages even when the tag already existed (release job exits 0).
  apt-repo:
    needs: release
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
