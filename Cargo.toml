[package]
name = "rings"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "DaisyDisk-style disk usage TUI for Linux, macOS, and Windows"
license = "MIT"
authors = ["Zach Wilke <zach@pinefall.dev>"]
readme = "README.md"
keywords = ["disk", "usage", "tui", "sunburst", "sysadmin"]
categories = ["command-line-utilities"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
